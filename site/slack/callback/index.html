<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'unsafe-inline'">
  <title>OpenRyoko — Slack</title>
  <style>
    body { font-family: system-ui, -apple-system, sans-serif; max-width: 32rem; margin: 5rem auto; padding: 0 1.25rem; line-height: 1.7; color: #1d1d1f; }
    h1 { font-size: 1.2rem; margin: 0 0 .5rem; }
    p { margin: .5rem 0; color: #515154; }
    code { background: #f2f2f4; padding: .1rem .35rem; border-radius: 4px; }
    a.button { display: inline-block; margin-top: 1rem; padding: .55rem 1.1rem; border-radius: 8px; background: #4f46e5; color: #fff; text-decoration: none; font-weight: 600; }
    @media (prefers-color-scheme: dark) { body { background: #1c1c1e; color: #f5f5f7; } p { color: #a1a1a6; } code { background: #2c2c2e; } }
  </style>
  <script type="module" src="./relay.js"></script>
</head>
<body>
  <section data-view="going">
    <h1>OpenRyoko に戻っています…</h1>
    <p>Slack での許可を、あなたの OpenRyoko に届けています。</p>
  </section>
  <section data-view="confirm" hidden>
    <h1>OpenRyoko に戻ります</h1>
    <p>Slack での許可を <code id="origin"></code> に届けます。あなたが開いている OpenRyoko のアドレスなら、続けてください。</p>
    <a class="button" id="continue" href="#">続ける</a>
  </section>
  <section data-view="broken" hidden>
    <h1>戻り先がわかりません</h1>
    <p>OpenRyoko の画面から「Slack で許可する」を押し直してください。</p>
  </section>
</body>
</html>
